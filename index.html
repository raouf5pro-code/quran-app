<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق القرآن الكريم والأحاديث الشريفة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1b4d3e;
            --accent-color: #c5a059;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 25px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--accent-color);
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: #e0e0e0;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-family: 'Amiri', serif;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-right: 5px solid var(--accent-color);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .controls-grid { grid-template-columns: 1fr; }
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            font-family: 'Amiri', serif;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }

        .quran-text {
            font-size: 1.5rem;
            line-height: 2.2;
            text-align: justify;
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .hadith-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .hadith-title {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>تطبيق القرآن الكريم والأحاديث النبوية</h1>
        <p>القرآن كاملاً (60 حزب) - تلاوات لأشهر القراء - الأحاديث الشريفة</p>
    </header>

    <div class="container">
        <!-- أزرار التنقل -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('quran')">📖 القرآن الكريم</button>
            <button class="tab-btn" onclick="switchTab('hadith')">📜 الأحاديث الشريفة</button>
        </div>

        <!-- قسم القرآن الكريم والتلاوات -->
        <div id="quran" class="tab-content active">
            <div class="card">
                <h3>استماع وتلاوة السور</h3>
                <div class="controls-grid">
                    <div>
                        <label>اختر القارئ:</label>
                        <select id="reciterSelect" onchange="loadAudio()"></select>
                    </div>
                    <div>
                        <label>اختر السورة:</label>
                        <select id="surahSelect" onchange="loadSurahText(); loadAudio();"></select>
                    </div>
                </div>

                <audio id="audioPlayer" controls>
                    متصفحك لا يدعم تشغيل الصوت.
                </audio>
            </div>

            <div class="card">
                <h3 id="surahTitle">نص السورة</h3>
                <div id="quranText" class="quran-text">
                    اختر السورة لعرض النص الشريف...
                </div>
            </div>
        </div>

        <!-- قسم الأحاديث الشريفة -->
        <div id="hadith" class="tab-content">
            <div class="card">
                <h3>الأحاديث النبوية الشريفة</h3>
                <div id="hadithContainer">
                    جاري تحميل الأحاديث...
                </div>
            </div>
        </div>
    </div>

    <script>
        const reciterSelect = document.getElementById('reciterSelect');
        const surahSelect = document.getElementById('surahSelect');
        const audioPlayer = document.getElementById('audioPlayer');
        const quranText = document.getElementById('quranText');
        const surahTitle = document.getElementById('surahTitle');

        // قائمة القرّاء
        async function fetchReciters() {
            try {
                const res = await fetch('https://mp3quran.net/api/v3/reciters?language=ar');
                const data = await res.json();
                reciterSelect.innerHTML = '';
                data.reciters.forEach(reciter => {
                    if (reciter.moshaf && reciter.moshaf.length > 0) {
                        const option = document.createElement('option');
                        option.value = reciter.moshaf[0].server;
                        option.textContent = reciter.name;
                        reciterSelect.appendChild(option);
                    }
                });
                loadAudio();
            } catch (err) {
                console.error("خطأ في جلب القرّاء", err);
            }
        }

        // قائمة السور (114 سورة)
        async function fetchSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                surahSelect.innerHTML = '';
                data.data.forEach(surah => {
                    const option = document.createElement('option');
                    option.value = surah.number;
                    option.textContent = `${surah.number}. ${surah.name} (${surah.numberOfAyahs} آية)`;
                    surahSelect.appendChild(option);
                });
                loadSurahText();
            } catch (err) {
                console.error("خطأ في جلب السور", err);
            }
        }

        // جلب نص السورة كاملاً
        async function loadSurahText() {
            const surahNum = surahSelect.value || 1;
            quranText.innerHTML = "جاري تحميل نص السورة...";
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
                const data = await res.json();
                const surah = data.data;
                surahTitle.textContent = `سورة ${surah.name}`;
                
                let textHtml = "";
                if (surahNum != 1 && surahNum != 9) {
                    textHtml += "<p style='text-align:center; font-weight:bold;'>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</p>";
                }
                
                surah.ayahs.forEach(ayah => {
                    textHtml += `${ayah.text} <b style="color:#c5a059;">﴿${ayah.numberInSurah}﴾</b> `;
                });
                quranText.innerHTML = textHtml;
            } catch (err) {
                quranText.innerHTML = "حدث خطأ أثناء تحميل نص السورة.";
            }
        }

        // تشغيل الصوت
        function loadAudio() {
            const server = reciterSelect.value;
            const surahNum = String(surahSelect.value || 1).padStart(3, '0');
            if (server) {
                audioPlayer.src = `${server}${surahNum}.mp3`;
            }
        }

        // جلب الأحاديث
        async function fetchHadith() {
            const container = document.getElementById('hadithContainer');
            container.innerHTML = `
                <div class="hadith-item">
                    <div class="hadith-title">الحديث الأول</div>
                    <p>عن أمير المؤمنين أبي حفص عمر بن الخطاب رضي الله عنه قال: سمعت رسول الله صلى الله عليه وسلم يقول: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى...» [رواه البخاري ومسلم]</p>
                </div>
                <div class="hadith-item">
                    <div class="hadith-title">الحديث الثاني</div>
                    <p>عن أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: «مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ...» [رواه البخاري ومسلم]</p>
                </div>
            `;
        }

        // التنقل بين الأقسام
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // بدء التشغيل
        window.onload = () => {
            fetchSurahs();
            fetchReciters();
            fetchHadith();
        };
    </script>
</body>
</html>
